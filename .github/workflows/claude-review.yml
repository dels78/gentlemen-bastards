name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: startsWith(github.head_ref, 'cursor/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PR diff and metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff "${{ github.event.pull_request.number }}" > /tmp/pr.diff
          {
            echo "title: ${{ github.event.pull_request.title }}"
            echo "---"
            echo "${{ github.event.pull_request.body }}"
          } > /tmp/pr-meta.txt

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Read `.github/claude/review-prompt.md` in the repository checkout and follow it exactly.

            Review pull request number ${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The full diff is at `/tmp/pr.diff` on this runner.
            PR title and body metadata are at `/tmp/pr-meta.txt`.

            Post exactly one PR review comment as specified in the prompt file.
