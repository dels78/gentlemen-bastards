name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: startsWith(github.head_ref, 'cursor/') && vars.CLAUDE_REVIEW_ENABLED == 'true'
    runs-on: arc-gentlemen-bastards
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare PR diff and metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git diff "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" > /tmp/pr.diff
          {
            printf 'title: %s\n' "$PR_TITLE"
            echo "---"
            printf '%s\n' "$PR_BODY"
          } > /tmp/pr-meta.txt

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: "--allowedTools Bash,Read,Write,Glob,Grep"
          prompt: |
            Read `.github/claude/review-prompt.md` in the repository checkout and follow it exactly.

            Review pull request number ${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The full diff is at `/tmp/pr.diff` on this runner.
            PR title and body metadata are at `/tmp/pr-meta.txt`.

            Write exactly one review comment to /tmp/review-comment.md as specified in the prompt file. Do not post it yourself.

      - name: Post review comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ -s /tmp/review-comment.md ]; then BODY_FILE=/tmp/review-comment.md; else printf '## Review verdict: FAIL\n\ncannot review: the reviewer run produced no review output.\n' > /tmp/review-fallback.md; BODY_FILE=/tmp/review-fallback.md; fi
          python3 -c 'import json,sys; print(json.dumps({"body": open(sys.argv[1]).read()}))' "$BODY_FILE" > /tmp/review-payload.json
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --data @/tmp/review-payload.json > /dev/null
          [ "$BODY_FILE" = "/tmp/review-comment.md" ]
