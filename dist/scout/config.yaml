# 728-D: Scout's per-profile config (D2 shape). Hand-authored first
# instance per specs/728-D.md §3 — the 728-F generator adopts this file
# later; until then `generator/generate.py --check` flags it as an
# extra dist file, which is the documented adoption path, not drift.
#
# This is the profile's user layer: Hermes expands ${VAR} refs in
# Scout's own secret scope (populated by the gateway env-writer from
# the hermes-managed-env Secret) before the managed overlay merges on
# top. No literals, no placeholders for secret values — refs only.
#
# Portal entry: Roll #2 (homeops PR #3777) replaced the CF-Access
# service-token headers with Hermes managed OAuth (auth: oauth), so
# this entry carries today's live overlay entry unchanged — url,
# auth, timeouts, and the portal-enabled tool names read live from
# Cloudflare 2026-11-10 (Linear 13, Gmail 6, Calendar 5). The entry
# name stays `cloudflare-portal`: Scout's seeded cron records pin
# that toolset name.
#
# Direct Google legs P3 (2026-11-17): the include list below now
# carries ONLY the 13 Linear names. The 11 Gmail/Calendar names
# were removed from this include — Scout's Google reads moved to
# personal-mcp's REST tools (see the personal-mcp entry). The
# portal still serves the Google names and its mappings are left
# untouched and dormant (spec D8): reverting this include is the
# one-edit rollback.
model:
  provider: claude-subscription-directsdk-experimental
  default: claude-haiku-5-5
  context_length: 1000000
mcp_servers:
  personal-mcp:
    enabled: true
    url: "http://personal-mcp.personal-mcp.svc.cluster.local:80/mcp"
    headers:
      Authorization: "Bearer ${MCP_SERVICE_TOKEN_HERMES}"
    connect_timeout: 30
    timeout: 300
    tools:
      # The five 728-K names (content fixed by 728-K D2, carried
      # unchanged from the managed overlay into this file) plus the
      # eleven direct-Google-legs read names (spec D5): Gmail reads
      # via the Gmail API and Calendar reads via the Calendar API,
      # served by personal-mcp under the server-side grant (D2).
      # These replace the portal's Gmail/Calendar names, which were
      # DPP-gated on every data call.
      include:
        - artifacts_write
        - artifacts_read
        - artifacts_list
        - runs_begin
        - runs_finish
        # GB-18: current brain head (`head_sha`). hermes-scout is already
        # granted brain_status server-side; this include makes the call visible.
        - brain_status
        - gmail_read_search_threads
        - gmail_read_get_thread
        - gmail_read_get_message
        - gmail_read_list_labels
        - gmail_read_list_drafts
        - gmail_read_get_draft
        - calendar_list_calendars
        - calendar_list_events
        - calendar_get_event
        - calendar_search_events
        - calendar_suggest_time
      resources: false
      prompts: false
  cloudflare-portal:
    enabled: true
    url: "https://scout.delisle.me/mcp"
    auth: oauth
    connect_timeout: 30
    timeout: 300
    tools:
      include:
        - linear_list_cycles
        - linear_get_document
        - linear_list_documents
        - linear_get_issue
        - linear_list_issues
        - linear_list_issue_statuses
        - linear_list_projects
        - linear_get_project
        - linear_list_milestones
        - linear_list_teams
        - linear_get_team
        - linear_get_workspace
        - linear_whoami
      resources: false
      prompts: false
